version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: compareit-backend:latest
    container_name: compareit-api-gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGINS=https://app.compareit.com,capacitor://localhost,http://localhost
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
